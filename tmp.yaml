apiVersion: v1
kind: Pod
metadata:
  name: dns-test
  namespace: auth
spec:
  restartPolicy: Never
  containers:
    - name: dns-test
      image: busybox:1.36
      command: ["nslookup", "smtp.migadu.com"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
