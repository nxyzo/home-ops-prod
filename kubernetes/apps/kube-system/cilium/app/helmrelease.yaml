---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    autoDirectNodeRoutes: true
    bpf:
      masquerade: true
      # Ref: https://github.com/siderolabs/talos/issues/10002
      hostLegacyRouting: true
    cni:
      # Required for pairing with Multus CNI
      exclusive: false
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    # NOTE: devices might need to be set if you have more than one active NIC on your hosts
    # devices: eno+ eth+
    dashboards:
      enabled: true
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    gatewayAPI:
      enabled: false
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"
          - "policy:sourceContext=app|workload-name|pod|reserved-identity;destinationContext=app|workload-name|pod|dns|reserved-identity;labelsContext=source_namespace,destination_namespace"
      export:
        static:
          enabled: true
          filePath: /var/run/cilium/hubble/events.log
          fileMaxSizeMb: 10
          fileMaxBackups: 5
          fieldMask:
            - time
            - verdict
            - drop_reason_desc     # menschenlesbarer Drop-Grund
            - drop_reason          # numerischer Code (für Alerting)
            - Type                 # event_type → CiliumEventType (Großbuchstabe!)
            - event_type           # alternative Schreibweise (je nach Cilium-Version)
            - traffic_direction    # INGRESS / EGRESS
            - is_reply             # asymmetrische Drops erkennen
            - node_name            # auf welchem Node hat der Drop stattgefunden
            - source.namespace
            - source.pod_name
            - source.identity      # Security-Identity (für reserved:host etc.)
            - source.labels        # Labels des Source-Endpoints
            - source.workloads     # Deployment/DaemonSet-Name
            - destination.namespace
            - destination.pod_name
            - destination.identity
            - destination.labels
            - destination.workloads
            - source_service       # Service-Objekt als Quelle
            - destination_service  # Service-Objekt als Ziel
            - IP                   # src/dst IP + ip_version (Großbuchstabe!)
            - l4                   # TCP/UDP/ICMP Ports
            - l7                   # HTTP/gRPC/DNS bei L7-Policy-Drops
            - Summary              # lesbarer Einzeiler (Großbuchstabe!)
          allowList:
            - '{"verdict":["DROPPED","ERROR"]}'
            - '{"verdict":["DROPPED"],"type":["L3_L4","L7"]}'
          denyList:
            - '{"source_pod":["kube-system/"]}'
            - '{"destination_pod":["kube-system/"]}'
            - '{"source_pod":["kube-system/cilium"]}'
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: "10.42.0.0/16"
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: true
    loadBalancer:
      algorithm: maglev
      mode: "dsr"
    localRedirectPolicies:
      enabled: true
    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 2
      rollOutPods: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    socketLB:
      enabled: true
      hostNamespaceOnly: true
    encryption:
      enabled: true
      type: wireguard