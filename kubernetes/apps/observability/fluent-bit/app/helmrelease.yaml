---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  chartRef:
    kind: OCIRepository
    name: fluent-bit
  interval: 1h
  values:
    config:
      service: |-
        [SERVICE]
          daemon off
          flush {{ .Values.flush }}
          log_level {{ .Values.logLevel }}
          parsers_file /fluent-bit/etc/parsers.conf
          parsers_file /fluent-bit/etc/conf/custom_parsers.conf
          http_server on
          http_listen 0.0.0.0
          http_port {{ .Values.metricsPort }}
          health_check on

      inputs: |-
        [INPUT]
          name tail
          alias kubernetes
          path /var/log/containers/*.log
          parser containerd
          tag kubernetes.*
          skip_empty_lines on
          skip_long_lines on

        [INPUT]
          name tail
          path /var/run/cilium/hubble/events.log
          tag hubble.*
          parser hubble_json
          refresh_interval 5
          rotate_wait 30

      filters: |-
        [FILTER]
          name kubernetes
          match kubernetes.*
          merge_log on
          kube_tag_prefix kubernetes.var.log.containers.
          k8s-logging.parser on
          k8s-logging.exclude on
          namespace_labels off
          annotations off
          buffer_size 1MB

        [FILTER]
          name nest
          match kubernetes.*
          operation lift
          nested_under kubernetes
          add_prefix k_

        [FILTER]
          name nest
          match kubernetes.*
          operation lift
          nested_under k_labels
          add_prefix k_labels_

        [FILTER]
          name modify
          match kubernetes.*
          rename k_labels_app.kubernetes.io/name app
          rename k_labels_app app
          rename k_labels_k8s-app app

        [FILTER]
          name nest
          match hubble.*
          operation lift
          nested_under flow
          add_prefix flow_

        [FILTER]
          name nest
          match hubble.*
          operation lift
          nested_under flow_source
          add_prefix flow_source_

        [FILTER]
          name nest
          match hubble.*
          operation lift
          nested_under flow_destination
          add_prefix flow_destination_

        [FILTER]
          name nest
          match hubble.*
          operation lift
          nested_under flow_IP
          add_prefix flow_IP_

        [FILTER]
          name nest
          match hubble.*
          operation lift
          nested_under flow_l4
          add_prefix flow_l4_

        [FILTER]
          name nest
          match hubble.*
          operation lift
          nested_under flow_l4_TCP
          add_prefix flow_l4_TCP_

        [FILTER]
          name nest
          match hubble.*
          operation lift
          nested_under flow_l4_UDP
          add_prefix flow_l4_UDP_

        [FILTER]
          name modify
          match hubble.*
          add stream hubble
          copy flow_drop_reason_desc _msg

      customParsers: |-
        [PARSER]
          name containerd
          format regex
          regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
          time_key time
          time_format %Y-%m-%dT%H:%M:%S.%L%z
        [PARSER]
          name hubble_json
          format json
          time_key time
          time_format %Y-%m-%dT%H:%M:%S.%LZ
          time_keep on

      outputs: |-
        [OUTPUT]
          name http
          match kubernetes.*
          host victoria-logs-server.observability.svc.cluster.local
          port 9428
          uri /insert/jsonline?_stream_fields=stream,k_namespace_name,k_pod_name,app&_msg_field=log&_time_field=date
          format json_lines
          json_date_format iso8601
          compress gzip
          log_response_payload false

        [OUTPUT]
          name http
          match hubble.*
          host victoria-logs-server.observability.svc.cluster.local
          port 9428
          uri /insert/jsonline?_stream_fields=stream,flow_verdict,flow_drop_reason_desc,flow_source_namespace,flow_source_pod_name,flow_destination_namespace,flow_destination_pod_name,flow_IP_source,flow_IP_destination,flow_l4_TCP_source_port,flow_l4_TCP_destination_port,flow_l4_UDP_source_port,flow_l4_UDP_destination_port&_msg_field=flow_drop_reason_desc&_time_field=time
          format json_stream
          json_date_format iso8601
          compress gzip
          log_response_payload false

    extraVolumes:
      - name: cilium-hubble
        hostPath:
          path: /var/run/cilium/hubble
          type: DirectoryOrCreate

    extraVolumeMounts:
      - name: cilium-hubble
        mountPath: /var/run/cilium/hubble
        readOnly: true

    dashboards:
      enabled: true

    serviceMonitor:
      enabled: true

    logLevel: warn

    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule