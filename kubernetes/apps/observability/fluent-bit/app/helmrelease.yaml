apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  chartRef:
    kind: OCIRepository
    name: fluent-bit
  interval: 1h
  values:
    kind: DaemonSet
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet

    config:
      service: |-
        [SERVICE]
          daemon off
          flush {{ .Values.flush }}
          log_level {{ .Values.logLevel }}
          parsers_file /fluent-bit/etc/parsers.conf
          parsers_file /fluent-bit/etc/conf/custom_parsers.conf
          http_server on
          http_listen 0.0.0.0
          http_port {{ .Values.metricsPort }}
          health_check on

      inputs: |-
        [INPUT]
          name tail
          alias kubernetes
          path /var/log/containers/*.log
          parser containerd
          tag kubernetes.*
          skip_empty_lines on
          skip_long_lines on

        [INPUT]
          name tail
          alias hubble
          path /var/run/cilium/hubble/events.log
          parser hubble_json
          tag hubble
          read_from_head true
          refresh_interval 5
          mem_buf_limit 50MB
          skip_long_lines on
          db /var/log/flb_hubble.db

        [INPUT]
          Name tcp
          Alias talos
          Listen 0.0.0.0
          Port 5170
          Format json
          Tag talos
          Threaded true
          Buffer_Size 256KB

      filters: |-
        [FILTER]
          name kubernetes
          match kubernetes.*
          merge_log on
          kube_tag_prefix kubernetes.var.log.containers.
          k8s-logging.parser on
          k8s-logging.exclude on
          namespace_labels off
          annotations off
          buffer_size 1MB

        [FILTER]
          name nest
          match kubernetes.*
          operation lift
          nested_under kubernetes
          add_prefix k_

        [FILTER]
          name nest
          match kubernetes.*
          operation lift
          nested_under k_labels
          add_prefix k_labels_

        [FILTER]
          name modify
          match kubernetes.*
          rename k_labels_app.kubernetes.io/name app
          rename k_labels_app app
          rename k_labels_k8s-app app

        # Hubble: flow.* -> flow_*
        [FILTER]
          Name nest
          Match hubble
          Operation lift
          Nested_under flow
          Add_prefix flow_

        # Hubble: flow_source.* -> source_*
        [FILTER]
          Name nest
          Match hubble
          Operation lift
          Nested_under flow_source
          Add_prefix source_

        # Hubble: flow_destination.* -> destination_*
        [FILTER]
          Name nest
          Match hubble
          Operation lift
          Nested_under flow_destination
          Add_prefix destination_

        # Hubble: flow_IP.* -> flow_IP_*
        [FILTER]
          Name nest
          Match hubble
          Operation lift
          Nested_under flow_IP
          Add_prefix flow_IP_

        # Hubble: normalize field names
        [FILTER]
          Name modify
          Match hubble
          Rename flow_time _time
          Rename flow_verdict verdict
          Rename flow_traffic_direction direction
          Rename flow_drop_reason drop_reason
          Rename flow_drop_reason_desc drop_reason_desc
          Rename flow_Summary summary
          Rename source_pod_name source_pod
          Rename destination_pod_name destination_pod
          Add stream hubble

        [FILTER]
          name grep
          match hubble
          exclude drop_reason_desc UNSUPPORTED_L3_PROTOCOL

        [FILTER]
          Name modify
          Match talos
          Rename talos-time _time
          Rename talos-level level
          Rename talos-service service
          Add stream talos

      customParsers: |-
        [PARSER]
          name containerd
          format regex
          regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
          time_key time
          time_format %Y-%m-%dT%H:%M:%S.%L%z

        [PARSER]
          name hubble_json
          format json
          time_key time
          time_format %Y-%m-%dT%H:%M:%S.%LZ
          time_keep on

      outputs: |-
        [OUTPUT]
          name http
          match kubernetes.*
          host victoria-logs-server.observability.svc.cluster.local
          port 9428
          uri /insert/jsonline?_stream_fields=stream,k_namespace_name,k_pod_name,app&_msg_field=log&_time_field=date
          format json_lines
          json_date_format iso8601
          compress gzip
          log_response_payload false

        [OUTPUT]
          Name http
          Match hubble
          Host victoria-logs-server.observability.svc.cluster.local
          Port 9428
          URI /insert/jsonline?_stream_fields=stream,verdict,direction,drop_reason_desc,source_namespace,destination_namespace&_msg_field=summary&_time_field=_time
          Format json_lines
          Json_date_format iso8601
          Compress gzip
          Log_Response_Payload false

        [OUTPUT]
          Name http
          Match talos
          Host victoria-logs-server.observability.svc.cluster.local
          Port 9428
          URI /insert/jsonline?_stream_fields=stream,service,level&_msg_field=msg&_time_field=_time
          Format json_lines
          Json_date_format iso8601
          Compress gzip
          Log_Response_Payload false

    extraVolumes:
      - name: cilium-hubble
        hostPath:
          path: /var/run/cilium/hubble
          type: DirectoryOrCreate

    extraVolumeMounts:
      - name: cilium-hubble
        mountPath: /var/run/cilium/hubble
        readOnly: true

    dashboards:
      enabled: true

    serviceMonitor:
      enabled: true

    logLevel: warn

    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists