---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: 1.12.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultSettings:
      defaultDataPath: "/var/mnt/longhorn"
      replicaDiskSoftAntiAffinity: false
      createDefaultDiskLabeledNodes: true
      defaultDataLocality: best-effort
      defaultLonghornStaticStorageClass: longhorn
      defaultReplicaCount: "3"
      guaranteedEngineManagerCPU: "5"
      guaranteedReplicaManagerCPU: "20"
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      disableSchedulingOnCordonedNode: true
      nodeDrainPolicy: block-for-eviction-if-contains-last-replica
      detachManuallyAttachedVolumesWhenCordoned: true
      orphanAutoDeletion: false
      deletingConfirmationFlag: true
      reclaimPolicy: retain
      replicaAutoBalance: best-effort
      storageMinimalAvailablePercentage: "10"
      storageReservedPercentageForDefaultDisk: "20"
      #v2DataEngine: true
    defaultBackupStore:
      backupTarget: s3://home-ops-prod-longhorn-backup@eu-central-003/
      backupTargetCredentialSecret: longhorn-s3-secret
    ingress:
      enabled: false
    metrics:
      serviceMonitor:
        enabled: true
    networkPolicies:
      enabled: false
    httproute:
      enabled: true
      hostname:
        - longhorn.${SECRET_DOMAIN}
      parentRef:
        name: envoy-internal
        namespace: network
        sectionName: https