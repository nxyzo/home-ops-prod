---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn-ui-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn-frontend
  oidc:
    provider:
      issuer: "https://authentik.${SECRET_DOMAIN}/application/o/longhorn/"
    clientID: "longhorn-envoy"
    clientSecret:
      name: authentik-longhorn-oidc
    redirectURL: "https://longhorn.${SECRET_DOMAIN}/"
