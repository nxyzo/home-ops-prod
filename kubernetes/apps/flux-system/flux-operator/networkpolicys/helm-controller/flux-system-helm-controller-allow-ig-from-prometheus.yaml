apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-system-helm-controller-allow-ig-from-prometheus
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: helm-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              name: prometheus
              instance: kube-prometheus-stack
      ports:
        - protocol: TCP
          port: 8080