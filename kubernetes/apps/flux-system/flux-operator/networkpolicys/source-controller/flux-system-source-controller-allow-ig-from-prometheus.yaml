apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-system-source-controller-allow-ig-from-prometheus
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: source-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            namespace: observability
        podSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
      ports:
      - protocol: TCP
        port: 8080