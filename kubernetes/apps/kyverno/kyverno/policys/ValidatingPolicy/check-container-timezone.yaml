apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: check-container-timezone
  annotations:
    policies.kyverno.io/title: Check Container Timezone
    policies.kyverno.io/category: Monitoring
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Validates that all containers in a Pod have the TZ environment
      variable set to Europe/Berlin. Runs in Audit mode: violations are
      reported but do not block the deployment.
spec:
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: >-
        !(object.metadata.namespace in ["kube-system", "kyverno"])
  validations:
    - expression: >-
        object.spec.containers.all(container,
          container.env.exists(e, e.name == "TZ" && e.value == "Europe/Berlin")
        )
      message: >-
        All containers must have TZ=Europe/Berlin explicitly set for
        consistent log/monitoring timestamps.
  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - jobs
        - cronjobs