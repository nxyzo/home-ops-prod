apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: cleanup-empty-replicasets
  annotations:
    policies.kyverno.io/title: Cleanup Empty ReplicaSets
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: ReplicaSet
    kyverno.io/kyverno-version: 1.15.0
    policies.kyverno.io/minversion: 1.15.0
    kyverno.io/kubernetes-version: 1.27+
    policies.kyverno.io/description: >-
      ReplicaSets serve as an intermediate controller for various Pod controllers
      like Deployments. This cleanup policy removes empty ReplicaSets across the
      cluster only when they are older than 7 days.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        resources:
          - replicasets
  conditions:
    - name: is-empty
      expression: object.spec.replicas == 0
    - name: older-than-7-days
      expression: time.now() - timestamp(object.metadata.creationTimestamp) > duration("168h")
  schedule: "0 0 * * 0"