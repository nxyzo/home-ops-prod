---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.3/helmrelease_v2.json?values=app-template/5.0.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trek
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: trek
  install:
    timeout: 2m
  upgrade:
    timeout: 2m
  values:
    controllers:
      trek:
        pod:
          hostUsers: false
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: false
            seccompProfile: {type: RuntimeDefault}
        containers:
          trek:
            image:
              repository: docker.io/mauriceboe/trek
              tag: 3.4.1@sha256:ce7fab639b89a6f62d484d1175a7d489a536a8c77291f56c03fec20608d4a3eb
            env:
              ALLOW_INTERNAL_NETWORK: true
              TZ: Europe/Berlin
              DEFAULT_LANGUAGE: de
              LOG_LEVEL: debug
              APP_URL: https://trek.${SECRET_DOMAIN}
              ALLOWED_ORIGINS: https://trek.${SECRET_DOMAIN}
              TRUST_PROXY: true
              ADMIN_EMAIL: trek-admin@${SECRET_DOMAIN}
              ADMIN_PASSWORD:
                secretKeyRef:
                  name: trek-admin-secret
                  key: ADMIN_PASSWORD
              ENCRYPTION_KEY:
                secretKeyRef:
                  name: trek-encryption-secret
                  key: ENCRYPTION_KEY
              OIDC_ONLY: true
              OIDC_ISSUER: https://auth.${SECRET_DOMAIN}/application/o/trek/
              OIDC_DISCOVERY_URL: https://auth.${SECRET_DOMAIN}/application/o/trek/.well-known/openid-configuration
              OIDC_CLIENT_ID: trek
              OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: trek-oidc-credentials
                  key: client_secret
              OIDC_ADMIN_CLAIM: groups
              OIDC_ADMIN_VALUE: trek-admins
              OIDC_SCOPE: openid email profile groups
              OIDC_DISPLAY_NAME: authentik
              SMTP_HOST: smtp.migadu.com
              SMTP_PORT: 465
              SMTP_USER: admin@${SECRET_DOMAIN}
              SMTP_PASS:
                secretKeyRef:
                  name: trek-smtp-secret
                  key: SMTP_PASSWORD
              SMTP_FROM: "trek <trek@${SECRET_DOMAIN}>"
            probes:
              readiness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 3000
                    path: /api/health
              liveness: *probes
            resources:
              requests:
                cpu: 12m
                memory: 128M
              limits:
                memory: 512M
            securityContext:
              allowPrivilegeEscalation: false
              seccompProfile: {type: RuntimeDefault}
              capabilities: {drop: ["ALL"]}
    service:
      trek:
        ports:
          http:
            port: *port
    route:
      trek:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOncePod
        size: 5Gi
        globalMounts:
          - path: /app/data
            subPath: data
          - path: /app/uploads
            subPath: uploads