apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: auth
data:
  passwordless-authentication.yaml: |
    version: 1

    metadata:
      name: Passwordless authentication flow

    entries:
      - model: authentik_flows.flow
        id: passwordless-flow
        identifiers:
          slug: passwordless-authentication-flow
        attrs:
          name: Passwordless Authentication
          title: Login with Passkey
          designation: authentication
          authentication: none
          denied_action: message_continue
          layout: stacked

      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: passwordless-webauthn-validation
        identifiers:
          name: authentication-webauthn-validation
        attrs:
          not_configured_action: configure
          configuration_stages:
            - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, "default-authenticator-webauthn-setup"]]
          device_classes:
            - webauthn
          webauthn_user_verification: required

      - model: authentik_stages_user_login.userloginstage
        id: passwordless-login
        identifiers:
          name: passwordless-authentication-login
        attrs:
          session_duration: seconds=0

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf passwordless-flow
          stage: !KeyOf passwordless-webauthn-validation
          order: 10

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf passwordless-flow
          stage: !KeyOf passwordless-login
          order: 100

      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          user_fields:
            - username
            - email

          passwordless_flow:
            !Find [
              authentik_flows.flow,
              [slug, passwordless-authentication-flow],
            ]

          webauthn_stage: !KeyOf passwordless-webauthn-validation

  password-policy-hardening.yaml: |
      version: 1
      metadata:
        name: Password policy hardening

      entries:
        - model: authentik_policies_password.passwordpolicy
          id: default-password-change-password-policy
          identifiers:
            name: default-password-change-password-policy
          attrs:
            length_min: 15
            check_static_rules: true
            check_zxcvbn: true
            zxcvbn_score_threshold: 2
            check_have_i_been_pwned: true
            hibp_allowed_count: 0
            password_field: password
            error_message: "Password must be at least 15 characters long and must not appear in known data breaches."
  groups.yaml: |
    version: 1

    metadata:
      name: Groups

    entries:
      - model: authentik_core.group
        id: infra-admins-group
        state: present
        identifiers:
          name: infra-admins
        attrs:
          name: infra-admins
          is_superuser: true
      - model: authentik_core.group
        id: users
        state: present
        identifiers:
          name: users
        attrs:
          name: users
          is_superuser: false

  oidc-longhorn.yaml: |
    version: 1

    metadata:
      name: Longhorn OIDC

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: longhorn-oidc-provider
        state: present

        identifiers:
          name: Longhorn

        attrs:
          name: Longhorn
          client_id: longhorn-envoy
          client_secret: !Env LONGHORN_OIDC_CLIENT_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token

          authorization_flow: !Find
            - authentik_flows.flow
            - [slug, default-provider-authorization-implicit-consent]

          invalidation_flow: !Find
            - authentik_flows.flow
            - [slug, default-provider-invalidation-flow]

          signing_key: !Find
            - authentik_crypto.certificatekeypair
            - [name, authentik Self-signed Certificate]

          redirect_uris:
            - matching_mode: strict
              url: "https://longhorn.${SECRET_DOMAIN}/oauth2/callback"

          property_mappings:
            - !Find
              - authentik_providers_oauth2.scopemapping
              - [managed, goauthentik.io/providers/oauth2/scope-openid]

            - !Find
              - authentik_providers_oauth2.scopemapping
              - [managed, goauthentik.io/providers/oauth2/scope-profile]

            - !Find
              - authentik_providers_oauth2.scopemapping
              - [managed, goauthentik.io/providers/oauth2/scope-email]

      - model: authentik_core.application
        id: longhorn-application
        state: present

        identifiers:
          slug: longhorn

        attrs:
          name: Longhorn
          slug: longhorn
          provider: !KeyOf longhorn-oidc-provider
          meta_launch_url: "https://longhorn.${SECRET_DOMAIN}/"
          meta_icon: "https://raw.githubusercontent.com/longhorn/longhorn/master/logos/icon-logo.png"
          policy_engine_mode: any
          open_in_new_tab: true
          group: "Infrastructure"

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf longhorn-application
          group: !Find [authentik_core.group, [name, infra-admins]]
          order: 0
        attrs:
          enabled: true
          negate: false