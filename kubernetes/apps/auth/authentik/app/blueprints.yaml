apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: auth
data:
  passwordless-authentication.yaml: |
    version: 1
    metadata:
      name: Passwordless authentication flow
    entries:
      - id: passwordless-authentication-flow
        model: authentik_flows.flow
        identifiers:
          slug: passwordless-authentication-flow
        attrs:
          name: Passwordless Authentication
          title: Login with Passkey
          designation: authentication
          authentication: none
          compatibility_mode: true
          layout: stacked
          denied_action: message_continue

      - id: authentication-webauthn-validation
        model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        identifiers:
          name: authentication-webauthn-validation
        attrs:
          not_configured_action: deny
          device_classes:
            - webauthn
          webauthn_user_verification: required

      - id: passwordless-authentication-login
        model: authentik_stages_user_login.userloginstage
        identifiers:
          name: passwordless-authentication-login
        attrs:
          session_duration: seconds=0

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf passwordless-authentication-flow
          stage: !KeyOf authentication-webauthn-validation
          order: 10

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf passwordless-authentication-flow
          stage: !KeyOf passwordless-authentication-login
          order: 100

      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          passwordless_flow: !KeyOf passwordless-authentication-flow