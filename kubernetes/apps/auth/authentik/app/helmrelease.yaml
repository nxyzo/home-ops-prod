---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik
  namespace: auth
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app

  install:
    remediation:
      retries: -1

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    postgresql:
      enabled: false

    global:
      env:
        - name: AUTHENTIK_STORAGE__BACKEND
          value: s3
        - name: AUTHENTIK_STORAGE__S3__ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-media-files-s3
              key: aws-access-key-id
        - name: AUTHENTIK_STORAGE__S3__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-media-files-s3
              key: aws-secret-access-key
        - name: AUTHENTIK_STORAGE__S3__BUCKET_NAME
          value: authentik-media-files
        - name: AUTHENTIK_STORAGE__S3__ENDPOINT
          value: https://s3.eu-central-003.backblazeb2.com
        - name: AUTHENTIK_STORAGE__S3__CUSTOM_DOMAIN
          value: s3.eu-central-003.backblazeb2.com/authentik-media-files
        - name: AUTHENTIK_STORAGE__S3__ADDRESSING_STYLE
          value: path
        # Longhorn OIDC Client Secret
        - name: LONGHORN_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-longhorn-oidc
              key: client-secret
        - name: POLICY_REPORTER_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-policy-reporter-oidc
              key: client-secret
        - name: HUBBLE_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-hubble-oidc
              key: client-secret
        - name: PROMETHEUS_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-prometheus-oidc
              key: client-secret
        - name: ALERTMANAGER_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-alertmanager-oidc
              key: client-secret
        - name: VICTORIALOGS_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-victorialogs-oidc
              key: client-secret
        - name: VMALERT_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-vmalert-oidc
              key: client-secret
        - name: GRAFANA_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-grafana-oidc
              key: client-secret
        - name: TREK_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-trek-oidc
              key: client-secret

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 25%
          maxUnavailable: 25%

    authentik:
      email:
          host: "smtp.migadu.com"
          port: 465
          username: admin@${SECRET_DOMAIN}
          use_tls: false
          use_ssl: true
          timeout: 10
          from: authentik@${SECRET_DOMAIN}
      postgresql:
        host: pg-authentik-rw.database.svc.cluster.local
        name: authentik
        user: file:///postgres-creds/username
        password: file:///postgres-creds/password
        port: 5432

    server:
      enabled: true
      replicas: 3

      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: secret_key
        - name: AUTHENTIK_EMAIL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-email-password
              key: password

      volumes:
        - name: postgres-creds
          secret:
            secretName: pg-authentik

      volumeMounts:
        - name: postgres-creds
          mountPath: /postgres-creds
          readOnly: true

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containerSecurityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

      pdb:
        enabled: true
        minAvailable: 1

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
          scrapeTimeout: 3s

      livenessProbe:
        failureThreshold: 3
        initialDelaySeconds: 5
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 3
        httpGet:
          path: "{{ .Values.authentik.web.path }}-/health/live/"
          port: http

      readinessProbe:
        failureThreshold: 3
        initialDelaySeconds: 5
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 3
        httpGet:
          path: "{{ .Values.authentik.web.path }}-/health/ready/"
          port: http

      startupProbe:
        failureThreshold: 60
        initialDelaySeconds: 5
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 3
        httpGet:
          path: "{{ .Values.authentik.web.path }}-/health/live/"
          port: http

      route:
        main:
          enabled: true
          hostnames:
            - authentik.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
          matches:
            - path:
                type: PathPrefix
                value: "{{ .Values.authentik.web.path }}"

    worker:
      enabled: true
      replicas: 3

      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: secret_key
        - name: AUTHENTIK_EMAIL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-email-password
              key: password

      volumes:
        - name: postgres-creds
          secret:
            secretName: pg-authentik
        - name: blueprints
          configMap:
            name: authentik-blueprints

      volumeMounts:
        - name: postgres-creds
          mountPath: /postgres-creds
          readOnly: true
        - name: blueprints
          mountPath: /blueprints/custom
          readOnly: true

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containerSecurityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

      pdb:
        enabled: true
        minAvailable: 1

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
          scrapeTimeout: 3s

      livenessProbe:
        failureThreshold: 3
        initialDelaySeconds: 5
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 3
        exec:
          command:
            - ak
            - healthcheck

      readinessProbe:
        failureThreshold: 3
        initialDelaySeconds: 5
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 3
        exec:
          command:
            - ak
            - healthcheck

      startupProbe:
        failureThreshold: 60
        initialDelaySeconds: 30
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 3
        exec:
          command:
            - ak
            - healthcheck

    prometheus:
      rules:
        enabled: true