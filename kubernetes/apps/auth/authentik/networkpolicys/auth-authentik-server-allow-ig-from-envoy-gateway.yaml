apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-webhook-allow-ig-from-envoy-gateway
  namespace: auth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: network
      - podSelector:
          matchLabels:
            helm.toolkit.fluxcd.io/name: envoy-gateway
      ports:
      - protocol: TCP
        port: 9000

