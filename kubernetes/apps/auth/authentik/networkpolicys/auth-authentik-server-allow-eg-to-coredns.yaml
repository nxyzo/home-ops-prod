apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-authentik-server-allow-eg-to-coredns
  namespace: auth
spec:
  podSelector:
    matchLabels:
      name: authentik
      component: server
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              name: coredns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53