apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: auth-authentik-server-allow-ig-from-host
  namespace: auth
spec:
  endpointSelector:
    matchLabels:
      name: authentik
      component: server
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - protocol: TCP
              port: "9090"