apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-cert-manager-allow-eg-to-world
  namespace: cert-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  egress:
    - toEntities:
        - world
      fromPorts:
        - ports:
            - protocol: TCP
              port: "443"