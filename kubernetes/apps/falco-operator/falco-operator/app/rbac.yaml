---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-operator-leader-election
  namespace: falco-operator
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-operator-leader-election
  namespace: falco-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: falco-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: falco-operator
    namespace: falco-operator